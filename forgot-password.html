
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google Fonts: Poppins & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAYACANTEEN - Forgot Password</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 18% 22%, #fffaf2 0%, #fff4e5 42%, #ffdeac 100%);
            font-family: 'Poppins', 'Inter', sans-serif;
        }

        .login-card {
            background: white;
            width: 90%;
            max-width: 420px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }

        h1 {
            color: #183b56;
            text-align: center;
        }

        p {
            color: #627d98;
            text-align: center;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 22px 0 8px;
            color: #334e68;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ffdeac;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #FFA500; font-weight: bold; box-shadow: 0 4px 14px rgba(255, 165, 0, 0.35);
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #e69500;
        }

        a {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #d97706; font-weight: bold;
            text-decoration: none;
        }

        #message {
            font-size: 13px;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <h1>Forgot Password?</h1>

        <p>Enter your student index number to request a password reset code.</p>

        <form action="forgot-password" method="post">
            <label for="indexNumber">Student Index Number</label>

            <input
                type="text"
                id="indexNumber"
                name="indexNumber"
                placeholder="Enter your index number"
                required
            >

            <button type="submit">Send OTP</button>
        </form>

        <p id="message" role="status"></p>

        <a href="login.html">Back to Login</a>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const message = document.getElementById("message");

        if (params.get("sent") === "1") {
            message.textContent =
                "If your account is registered, a reset code will be sent to its email.";
        } else if (params.get("error") === "empty") {
            message.textContent = "Please enter your index number.";
        } else if (params.get("error") === "mail") {
            message.textContent =
                "Email could not be sent. Please try again later.";
        }
    </script>
</body>
</html>
