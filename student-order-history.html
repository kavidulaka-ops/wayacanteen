<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google Fonts: Poppins & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAYACANTEEN - My Orders</title>

    <!-- PWA Configuration & Theme Color -->
    <meta name="theme-color" content="#ea580c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WAYACANTEEN">
    <meta name="application-name" content="WAYACANTEEN">
    <meta name="msapplication-TileColor" content="#ea580c">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="images/icons/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/icons/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/icons/apple-touch-icon.png">

    <link rel="stylesheet" href="food.css">
    <link rel="stylesheet" href="student-order-history.css">
    <link rel="stylesheet" href="pwa.css">

    <script src="pwa-install.js" defer></script>
</head>

<body class="food-page-body">

    <!-- Diagonal Subtle Overlay -->
    <div class="food-bg-pattern" aria-hidden="true"></div>

    <!-- Outer Decorative Props Layer -->
    <div class="food-props-layer" aria-hidden="true">
        <img src="images/samosa-3d.png" class="food-float-prop prop-food-samosa" alt="Samosa">
        <img src="images/parippu-vadai-3d.png" class="food-float-prop prop-food-parippu" alt="Parippu Vadai">
        <img src="images/stationery-notebook-3d.png" class="food-float-prop prop-food-notebook" alt="Notebook">
        <img src="images/stationery-calculator-3d.png" class="food-float-prop prop-food-calculator" alt="Calculator">
    </div>

    <!-- Top Canopy Header -->
    <header class="food-hero-canopy">
        <nav class="food-navbar">
            <div class="brand" onclick="goHome()" role="button" tabindex="0" title="WAYACANTEEN Home">
                <div class="brand-icon">W</div>
                <span>WAYACANTEEN</span>
            </div>

            <div class="home-queue-pill home-queue-medium" id="homeQueuePill" title="Live Canteen Rush Status">
                <span class="pill-live-tag">LIVE</span>
                <span class="pill-dot"></span>
                <span class="pill-status-text">Moderate Crowd</span>
                <span class="pill-clock-svg">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                </span>
                <span class="pill-wait-text">Wait: ~12 mins</span>
            </div>

            <div class="nav-right">
                <button class="nav-back-btn" onclick="window.location.href='feedback.html'" type="button" title="Give Canteen Feedback" style="margin-right: 8px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    <span>Feedback</span>
                </button>
                <button class="nav-back-btn" onclick="goHome()" type="button" title="Back to Home Dashboard">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    <span>Dashboard</span>
                </button>
            </div>
        </nav>
    </header>

    <!-- Main Container Card -->
    <main class="food-main-stage">

        <div class="food-section-header">
            <div>
                <span class="section-tag">PRE-ORDERS TRACKING</span>
                <h1 class="section-title">My Orders History</h1>
                <p class="section-subtitle">Track your live meal preparation status and past completed canteen orders</p>
            </div>
        </div>

        <!-- Filter Pills Bar -->
        <div class="order-filter-bar">
            <div class="filter-pills-group">
                <button class="order-filter-pill active" onclick="filterOrders('Active')" type="button" id="tabActive">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <span>Active Pre-Orders</span>
                    <span class="pill-count" id="activeCount">0</span>
                </button>
                <button class="order-filter-pill" onclick="filterOrders('Completed')" type="button" id="tabCompleted">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                    <span>Completed</span>
                    <span class="pill-count" id="completedCount">0</span>
                </button>
                <button class="order-filter-pill" onclick="filterOrders('All')" type="button" id="tabAll">
                    <span>All Orders</span>
                    <span class="pill-count" id="allCount">0</span>
                </button>
            </div>
            <div class="filter-actions-group">
                <button class="btn-clear-history" onclick="clearCompletedHistory()" type="button" title="Dismiss all completed orders from history">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    <span>Clear Completed</span>
                </button>
            </div>
        </div>

        <!-- Orders Container -->
        <section id="ordersContainer" class="student-orders-container">
            <div class="loading-state">
                Loading your orders...
            </div>
        </section>

    </main>

    <footer class="app-footer">
        <div class="footer-inner">
            <div class="footer-brand">
                <div class="brand-icon" style="width: 28px; height: 28px; font-size: 16px;">W</div>
                <span>&copy; 2026 <strong>WAYACANTEEN</strong> - University Canteen Management System</span>
            </div>
            <div class="footer-links">
                <a href="home.html">Dashboard</a>
                <a href="food.html">Food Menu</a>
                <a href="cart.html">Cart</a>
                <a href="help-center.html">Help Center</a>
            </div>
        </div>
    </footer>

    <script src="canteen-queue-live.js"></script>
    <script src="student-order-history.js?v=20261101_v3"></script>
    <script>
        function goHome() {
            window.location.href = "home.html";
        }
    </script>
</body>
</html>
