<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google Fonts: Poppins & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAYACANTEEN - Staff Forgot Password</title>

    <!-- PWA Configuration & Theme Color -->
    <meta name="theme-color" content="#ea580c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WAYACANTEEN">
    <meta name="application-name" content="WAYACANTEEN">
    <meta name="msapplication-TileColor" content="#ea580c">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="images/icons/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/icons/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/icons/apple-touch-icon.png">

    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="pwa.css">

    <script src="pwa-install.js" defer></script>
</head>

<body>

    <!-- Background Diagonal Subtle Pattern -->
    <div class="login-bg-pattern" aria-hidden="true"></div>

    <!-- Bottom Sweeping White Floor Wave -->
    <div class="login-bottom-wave" aria-hidden="true">
        <svg viewBox="0 0 1440 160" preserveAspectRatio="none">
            <path d="M0,80 C360,20 720,130 1080,60 C1260,25 1380,70 1440,80 L1440,160 L0,160 Z" fill="#ffffff"></path>
        </svg>
    </div>

    <!-- Floating Food & Stationery Props Layer -->
    <div class="login-props-layer" aria-hidden="true">
        <img src="images/stationery-notebook-3d.png" class="float-prop prop-notebook" alt="Spiral Notebook">
        <img src="images/samosa-3d.png" class="float-prop prop-samosa" alt="Crispy Samosa">
        <img src="images/ulundu-vadai-3d.png" class="float-prop prop-ulundu" alt="Ulundu Vadai">
        <img src="images/sausage-bun-3d.png" class="float-prop prop-sausage-bun" alt="Sausage Bun">
        <img src="images/stationery-pen-highlighter-3d.png" class="float-prop prop-pen" alt="Pen and Highlighter">
        <img src="images/parippu-vadai-3d.png" class="float-prop prop-parippu" alt="Parippu Vadai">
        <img src="images/stationery-calculator-3d.png" class="float-prop prop-calculator" alt="Student Calculator">
        <img src="images/vegetable-roti-3d.png" class="float-prop prop-roti" alt="Vegetable Roti">

        <svg class="garnish-prop garnish-leaf-left" width="34" height="34" viewBox="0 0 40 40" fill="none">
            <path d="M8 32C8 32 10 12 28 6C34 16 32 30 18 34C13 35 8 32 8 32Z" fill="#65a30d"/>
            <path d="M12 28C15 22 22 14 28 6" stroke="#4d7c0f" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <svg class="garnish-prop garnish-tomato-left" width="34" height="34" viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="16" fill="#ef4444"/>
            <circle cx="20" cy="20" r="11" fill="#dc2626"/>
            <circle cx="16" cy="16" r="3" fill="#fca5a5"/>
            <circle cx="24" cy="22" r="2.5" fill="#fca5a5"/>
        </svg>
    </div>

    <!-- Live Canteen Queue / Rush Status Banner -->
    <div class="canteen-live-banner" id="canteenLiveBanner" role="region" aria-label="Live Canteen Queue Status">
        <div class="live-banner-left">
            <div class="live-pulse-container" title="Real-time canteen rush update">
                <span class="live-pulse-dot" id="liveDot"></span>
                <span>LIVE</span>
            </div>
            <div class="live-info-block">
                <div class="live-header-row">
                    <span class="live-canteen-title">Canteen Queue Status:</span>
                    <span class="live-badge level-low" id="liveLevelBadge">
                        <span id="badgeIcon">•</span>
                        <span id="badgeText">Low Queue</span>
                    </span>
                </div>
                <p class="live-subnote" id="liveNote">Few or no line at the counter · Fast counter service</p>
            </div>
        </div>

        <div class="live-banner-right">
            <div class="live-metric-card" title="Estimated wait time at the counter">
                <span class="metric-emoji"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg></span>
                <div class="metric-data">
                    <span class="metric-value" id="metricWait">~5 mins</span>
                    <span class="metric-label">Est. Wait</span>
                </div>
            </div>
            <button class="live-refresh-btn" id="liveRefreshBtn" type="button" title="Refresh live status" aria-label="Refresh live status">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
            </button>
        </div>
    </div>

    <!-- Centered Main Content Wrapper -->
    <main class="login-main-wrapper">

        <div class="login-card">

            <div class="login-header">
                <div style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px;">
                    <span style="background: #ea580c; color: #fff; width: 28px; height: 28px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;">W</span>
                    <span style="font-size: 13px; font-weight: 700; color: #ea580c; text-transform: uppercase; letter-spacing: 0.5px;">Staff Portal</span>
                </div>
                <h2 class="login-title">Staff Password Reset</h2>
                <p class="login-subtitle">Enter your staff username to receive a verification code</p>
            </div>

            <div id="staffForgotMessage" class="message" role="alert" hidden></div>

            <form action="staff-forgot-password" method="post" id="staffForgotForm">

                <div class="input-group">
                    <label for="staffUsername">Staff Username</label>
                    <input
                        type="text"
                        id="staffUsername"
                        name="staffUsername"
                        placeholder="Enter your staff username"
                        autocomplete="username"
                        required
                        autofocus
                    >
                </div>

                <button type="submit" class="login-button">
                    Send Verification Code
                </button>

            </form>

            <div class="divider">
                <span>Authorized Personnel Only</span>
            </div>

            <p class="account-switch">
                Remember your credentials?
                <a href="staff-login.html"><strong>Staff Login</strong></a>
            </p>

            <p class="account-switch back-home">
                <a href="index.html">&larr; Back to Portal Home</a>
            </p>

        </div>

    </main>

    <script src="canteen-queue-live.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const msg = document.getElementById("staffForgotMessage");
        if (params.get("sent") === "1") {
            msg.textContent = "If this staff username exists, a verification code has been sent.";
            msg.classList.add("success");
            msg.hidden = false;
        } else if (params.get("error") === "empty") {
            msg.textContent = "Please enter your staff username.";
            msg.classList.add("error");
            msg.hidden = false;
        }
    </script>
</body>
</html>
