<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google Fonts: Poppins & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAYACANTEEN - Staff Login</title>
    <link rel="stylesheet" href="staff-login.css">
</head>
<body>

    <main class="login-container">
        <div class="login-card">

            <!-- BRAND HEADER -->
            <div class="brand-header">
                <div class="brand-icon">C</div>
                <span class="brand-badge">Authorized Personnel</span>
                <h1>Staff Login</h1>
                <p class="subtitle">Enter your credentials to access the canteen management dashboard.</p>
            </div>

            <!-- ALERT / ERROR NOTIFICATION -->
            <div id="errorMessage" class="alert-banner error" style="display: none;"></div>

            <!-- LOGIN FORM -->
            <form action="staff-login" method="post" id="staffLoginForm">

                <!-- STAFF USERNAME -->
                <div class="form-group">
                    <label for="staffId">Staff Username / ID</label>
                    <div class="input-wrapper">
                        <input
                            type="text"
                            id="staffId"
                            name="staffId"
                            placeholder="e.g. STAFF001"
                            autocomplete="username"
                            required
                            autofocus
                        >
                    </div>
                </div>

                <!-- PASSWORD -->
                <div class="form-group">
                    <div class="form-row-between">
                        <label for="password">Password</label>
                        <a href="staff-forgot-password.html" class="forgot-link">Forgot Password?</a>
                    </div>
                    <div class="input-wrapper has-toggle">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                        <button
                            type="button"
                            class="toggle-password-btn"
                            id="togglePassword"
                            aria-label="Show or hide password"
                            title="Show/Hide Password"
                        >
                            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- SUBMIT BUTTON -->
                <button type="submit" class="btn-submit" id="loginBtn">
                    Login to Staff Panel
                </button>

            </form>

            <!-- FOOTER -->
            <div class="card-footer" style="display: flex; flex-direction: column; gap: 8px;">
                <a href="login.html" class="back-link">
                    &larr; Back to Student Login
                </a>
                <a href="index.html" class="back-link" style="color: #64748b;">
                    &larr; Back to Portal Home
                </a>
            </div>

        </div>
    </main>

    <script src="staff-login.js"></script>
</body>
</html>
