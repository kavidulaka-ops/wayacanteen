<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google Fonts: Poppins & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAYACANTEEN - Staff Order History</title>

    <!-- PWA Configuration & Theme Color -->
    <meta name="theme-color" content="#ea580c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WAYACANTEEN">
    <meta name="application-name" content="WAYACANTEEN">
    <meta name="msapplication-TileColor" content="#ea580c">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="images/icons/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/icons/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/icons/apple-touch-icon.png">

    <link rel="stylesheet" href="food.css">
    <link rel="stylesheet" href="order-history.css?v=20261121_v2">
    <link rel="stylesheet" href="pwa.css">

    <script src="pwa-install.js" defer></script>
</head>

<body class="food-page-body">

    <!-- Diagonal Subtle Texture Overlay -->
    <div class="food-bg-pattern" aria-hidden="true"></div>

    <!-- Outer Decorative Props Layer -->
    <div class="food-props-layer" aria-hidden="true">
        <img src="images/samosa-3d.png" class="food-float-prop prop-food-samosa" alt="Samosa">
        <img src="images/stationery-calculator-3d.png" class="food-float-prop prop-food-calculator" alt="Calculator">
        <img src="images/stationery-notebook-3d.png" class="food-float-prop prop-food-notebook" alt="Notebook">
        <img src="images/parippu-vadai-3d.png" class="food-float-prop prop-food-parippu" alt="Parippu Vadai">
    </div>

    <!-- Top Canopy Header (Signature Orange) -->
    <header class="food-hero-canopy">
        <nav class="food-navbar">
            <div class="brand" onclick="goDashboard()" role="button" tabindex="0" title="Staff Dashboard">
                <div class="brand-icon">W</div>
                <div>
                    <span style="font-size: 16px; font-weight: 700; color: #ffffff;">WAYACANTEEN</span>
                    <small style="display: block; font-size: 13px; color: rgba(255, 255, 255, 0.85); font-weight: 500;">Order Archive</small>
                </div>
            </div>

            <!-- Live Canteen Rush Badge -->
            <div class="home-queue-pill home-queue-medium" id="homeQueuePill" title="Live Canteen Rush Status">
                <span class="pill-live-tag">LIVE</span>
                <span class="pill-dot"></span>
                <span class="pill-status-text">Moderate Crowd</span>
                <span class="pill-clock-svg">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                </span>
                <span class="pill-wait-text">Wait: ~12 mins</span>
            </div>

            <div class="nav-right">
                <button class="nav-back-btn" onclick="window.location.href='staff-feedback.html'" type="button" title="View Student Feedbacks">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    <span>Feedback</span>
                </button>
                <button class="nav-back-btn" onclick="goDashboard()" type="button" title="Back to Dashboard">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    <span>Dashboard</span>
                </button>
            </div>
        </nav>

        <div class="food-hero-content">
            <div class="canteen-tag-pill">
                <span class="tag-dot"></span>
                <span>ACCEPTED &amp; COMPLETED ORDERS</span>
            </div>
            <h1 class="food-hero-title">Staff Order History</h1>
            <p class="food-hero-subtitle">
                Complete archive of all fulfilled, paid, and completed food and stationery orders.
            </p>
        </div>
    </header>

    <!-- Bottom Sweeping White Floor Wave -->
    <div class="food-bottom-wave" aria-hidden="true">
        <svg viewBox="0 0 1440 140" preserveAspectRatio="none">
            <path d="M0,60 C360,10 720,110 1080,45 C1260,20 1380,55 1440,60 L1440,140 L0,140 Z" fill="#ffffff"></path>
        </svg>
    </div>

    <!-- Main Floor Section -->
    <main class="food-floor-section">
        <div class="food-floor-container">

            <!-- Filter & Action Bar -->
            <div class="history-controls-row">
                <div class="order-filter-bar">
                    <button class="order-filter-pill active" onclick="filterOrders('All')" type="button">All Orders</button>
                    <button class="order-filter-pill" onclick="filterOrders('Food')" type="button">Food Items</button>
                    <button class="order-filter-pill" onclick="filterOrders('Stationery')" type="button">Stationery Items</button>
                    <button class="order-filter-pill" onclick="filterOrders('Both')" type="button">Combined Orders</button>
                </div>

                <button class="btn-clear-history" onclick="clearHistory()" type="button" title="Clear History Archive">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    <span>Clear History</span>
                </button>
            </div>

            <!-- Orders Container -->
            <section id="historyContainer" class="history-container">
                <!-- JavaScript renders order cards here -->
            </section>

        </div>
    </main>

    <!-- App Footer -->
    <footer class="app-footer">
        <div class="footer-inner">
            <div class="footer-brand">
                <div class="brand-icon" style="width: 28px; height: 28px; font-size: 16px;">W</div>
                <span>&copy; 2026 <strong>WAYACANTEEN</strong> - Staff Management Console</span>
            </div>
            <div class="footer-links">
                <a href="staff-dashboard.html">Dashboard</a>
                <a href="pending-orders.html">Orders</a>
                <a href="staff-food.html">Food Menu</a>
                <a href="staff-stationery.html">Stationery</a>
                <a href="staff-help-center.html">Help Desk</a>
            </div>
        </div>
    </footer>

    <script src="canteen-queue-live.js"></script>
    <script src="order-history.js"></script>
</body>
</html>
