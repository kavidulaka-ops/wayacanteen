
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google Fonts: Poppins & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAYACANTEEN - Reset Password</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 18% 22%, #fffaf2 0%, #fff4e5 42%, #ffdeac 100%);
            padding: 20px;
        }

        .reset-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            color: #d97706;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        h2 {
            text-align: center;
            color: #202938;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #687386;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            color: #303b4d;
            font-size: 13px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #ffdeac;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #d97706;
        }

        .otp-input {
            letter-spacing: 6px;
            text-align: center;
            font-size: 24px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #FFA500; box-shadow: 0 4px 14px rgba(255, 165, 0, 0.35);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #e69500;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #d97706;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="reset-card">

        <div class="logo">WAYACANTEEN</div>

        <h2>Reset Password</h2>

        <p class="description">
            Enter the verification code sent to your email
            and choose a new password.
        </p>

        <form action="reset-password" method="post">

            <label for="otp">Verification Code</label>
            <input
                type="text"
                id="otp"
                name="otp"
                class="otp-input"
                inputmode="numeric"
                pattern="[0-9]{6}"
                maxlength="6"
                placeholder="000000"
                autocomplete="one-time-code"
                required>

            <label for="newPassword">New Password</label>
            <input
                type="password"
                id="newPassword"
                name="newPassword"
                minlength="8"
                autocomplete="new-password"
                placeholder="Enter new password"
                required>

            <label for="confirmPassword">Confirm New Password</label>
            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                minlength="8"
                autocomplete="new-password"
                placeholder="Re-enter new password"
                required>

            <button type="submit">Verify & Reset Password</button>

        </form>

        <a class="back-link" href="forgot-password.html">
            Back to Forgot Password
        </a>

    </div>

</body>
</html>
