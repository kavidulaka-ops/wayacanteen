
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google Fonts: Poppins & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WAYACANTEEN - Staff Forgot Password</title>

    <link rel="stylesheet" href="staff-login.css">

    <style>
        .forgot-card {
            width: min(400px, calc(100% - 40px));
            margin: 70px auto;
            padding: 30px;
            box-sizing: border-box;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
        }

        .forgot-card h2 {
            margin-bottom: 10px;
        }

        .forgot-card p {
            color: #666;
            line-height: 1.5;
            font-size: 13px;
        }

        .forgot-card label {
            display: block;
            margin: 20px 0 8px;
        }

        .forgot-card input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .forgot-card button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        .forgot-card button:hover {
            background: #1d4ed8;
        }

        .back-link {
            display: block;
            margin-top: 18px;
            text-align: center;
            text-decoration: none;
            color: #2563eb;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <main class="forgot-card">

        <h2>Forgot Password?</h2>

        <p>
            Enter your staff username to receive a verification
            code at your registered email address.
        </p>

        <form action="staff-forgot-password" method="post">

            <label for="staffUsername">Staff Username</label>

            <input
                type="text"
                id="staffUsername"
                name="staffUsername"
                placeholder="Enter your staff username"
                autocomplete="username"
                required
            >

            <button type="submit">
                Send Verification Code
            </button>

        </form>

        <a href="staff-login.html" class="back-link">
            ← Back to Staff Login
        </a>

    </main>

</body>
</html>
