
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google Fonts: Poppins & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAYACANTEEN - Reset Staff Password</title>
    <link rel="stylesheet" href="staff-login.css">

    <style>
        .reset-card {
            width: min(420px, calc(100% - 32px));
            margin: 60px auto;
            padding: 30px;
            box-sizing: border-box;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .10);
        }

        .reset-card p {
            color: #666;
            line-height: 1.5;
        }

        .reset-card label {
            display: block;
            margin: 18px 0 7px;
        }

        .reset-card input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .reset-card button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #fff;
            cursor: pointer;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <main class="reset-card">
        <h2>Reset Staff Password</h2>

        <p>Enter the 6-digit verification code sent to your email,
           then choose a new password.</p>

        <form action="staff-reset-password" method="post">

            <label for="otp">Verification Code</label>
            <input
                type="text"
                id="otp"
                name="otp"
                inputmode="numeric"
                pattern="[0-9]{6}"
                maxlength="6"
                autocomplete="one-time-code"
                placeholder="000000"
                required>

            <label for="newPassword">New Password</label>
            <input
                type="password"
                id="newPassword"
                name="newPassword"
                minlength="8"
                autocomplete="new-password"
                placeholder="Enter new password"
                required>

            <label for="confirmPassword">Confirm New Password</label>
            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                minlength="8"
                autocomplete="new-password"
                placeholder="Re-enter new password"
                required>

            <button type="submit">Verify &amp; Reset Password</button>
        </form>

        <a href="staff-login.html" class="back-link">
            Back to Staff Login
        </a>
    </main>

</body>
</html>
